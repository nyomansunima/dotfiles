##############################################
#                                            #
#            Friday Light Theme              #
#                                            #
##############################################

# Based on the friday-light Ghostty terminal theme.
# https://superfile.dev/configure/custom-theme/

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

code_syntax_highlight = "gruvbox-light"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#654735"
full_screen_bg = "#f2e5bc"

#-- Gradient
gradient_color = ["#45707a", "#945e80"]
directory_icon_color = ""

#-- File Panel
file_panel_fg = "#654735"
file_panel_bg = "#f2e5bc"
file_panel_border = "#c9b98f"
file_panel_border_active = "#45707a"
file_panel_top_directory_icon = "#6c782e"
file_panel_top_path = "#45707a"
file_panel_item_selected_fg = "#45707a"
file_panel_item_selected_bg = "#ebdbb2"

#-- Footer
footer_fg = "#654735"
footer_bg = "#f2e5bc"
footer_border = "#c9b98f"
footer_border_active = "#6c782e"

#-- Sidebar
sidebar_fg = "#654735"
sidebar_bg = "#f2e5bc"
sidebar_title = "#4c7a5d"
sidebar_border = "#f2e5bc"
sidebar_border_active = "#c14a4a"
sidebar_item_selected_fg = "#45707a"
sidebar_item_selected_bg = "#ebdbb2"
sidebar_divider = "#a8987a"

#-- Modals
modal_fg = "#654735"
modal_bg = "#f2e5bc"
modal_border_active = "#a8987a"
modal_cancel_fg = "#f2e5bc"
modal_cancel_bg = "#c14a4a"
modal_confirm_fg = "#f2e5bc"
modal_confirm_bg = "#45707a"

#-- Help Menu
help_menu_hotkey = "#45707a"
help_menu_title = "#c14a4a"

#-- Special
cursor = "#654735"
correct = "#6c782e"
error = "#c14a4a"
hint = "#4c7a5d"
cancel = "#b47109"
