# HELIX CONFIGURATION FILE
# You can find all of the configuration detail on the official documentation
theme = "gruvbox_light_soft"

# Editor configuration
[editor]
true-color = true
bufferline = "multiple"
line-number = "relative"
mouse = false

[editor.cursor-shape]
insert = "block"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

# Keymaps configuration
[keys.normal]
C-g = [":new", ":insert-output lazygit", ":buffer-close!", ":redraw"]
C-f = [":new", ":insert-output broot -s", ":buffer-close!"]
esc = ["collapse_selection", "keep_primary_selection"]

# Space e opens the file explorer in the current buffer's directory,
# Space E opens it in the current working directory
[keys.normal.space]
e = "file_explorer_in_current_buffer_directory"
E = "file_explorer_in_current_directory"
